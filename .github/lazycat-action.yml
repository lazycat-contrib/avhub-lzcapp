version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/avhub.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: avhub

build:
  run_buildscript: false

images:
  # 上游有完整三段 SemVer tag（1.0.0/1.0.2/1.0.3），排除 latest 与构建 hash
  - id: avhub
    target: service
    service: avhub
    source: levywang/avhub
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror

stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: AvHub
    summary: "成人视频资源管理平台"
